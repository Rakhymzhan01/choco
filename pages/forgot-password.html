<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password | choco</title>
<meta name="description" content="choco – coupons and discounts in Almaty">
<link rel="icon" href="../images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-base="../" data-page="forgot">
<header class="site-header" id="site-header"></header>
<main id="main">

<div class="auth-wrap"><div class="auth-card">
  <div class="auth-logo"><a class="logo" href="../index.html"><img src="../images/logo.svg" alt="" width="44" height="44"><span>choco</span></a></div>
  <h1>Reset password</h1><p class="auth-sub">Enter your email and we'll send a reset link</p>
  <div id="info-alert" class="alert" hidden role="status"></div>
  <form id="auth-form" novalidate>
    <div class="field"><label for="email">Email <span class="req">*</span></label><input id="email" name="email" type="email" placeholder="student@email.com" ><small class="error" role="alert"></small></div>
    <button class="btn btn-primary btn-lg btn-block" type="submit">Send reset link</button>
  </form>
  <div class="auth-links"><p><a href="../login.html">← Back to login</a></p></div>
</div></div>

</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/validation.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/auth-pages.js"></script>
</body>
</html>
